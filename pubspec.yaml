name: lbp_ssh
description: "跨平台 SSH 终端管理器，支持配置同步到 GitHub/Gitee"
publish_to: "none"

version: 1.9.9

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter

  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # App info
  package_info_plus: ^10.1.0

  # SSH 客户端
  dartssh2: ^3.3.1

  # 终端模拟器
  kterm: ^1.5.7
  flutter_pty: ^0.4.0+2

  # 状态管理
  flutter_riverpod: ^3.3.1

  # HTTP 客户端
  dio: ^5.11.1

  # 加密
  pointycastle: ^4.0.0

  # 错误追踪
  sentry: ^9.27.0

  # 路径处理
  path: ^1.9.0

  # URL 启动器
  url_launcher: ^6.2.4

  # JSON 序列化
  json_annotation: ^4.12.0

  # 路径处理
  path_provider: ^2.1.1

  # 共享首选项
  shared_preferences: ^2.5.5

  # UUID 生成
  uuid: ^4.5.3

  # 文件选择器
  file_picker: ^12.1.1

  # 窗口管理
  window_manager: ^0.5.1

  # 桌面拖拽支持
  desktop_drop: ^0.8.0
  cross_file: ^0.3.5+2
  socks5_proxy: ^2.1.1

  # TUI
  utopia_tui: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Integration tests
  integration_test:
    sdk: flutter

  # Mocking
  mocktail: ^1.0.4

  # 代码生成 & 测试
  build_runner: ^2.14.1
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  test: any
  file_picker_platform_interface: ^3.0.1

# 锁定 file_picker 系依赖到已验证可用的精确版本，避免 CI/本地解析漂移。
# 根因：pubspec.lock 的 source 是 pub.flutter-io.cn（国内镜像），而 GitHub CI 用
#   pub.dev，host 不一致导致 CI 的 `flutter pub get` 重新解析全部依赖，把
#   file_picker 系漂移到新版（android/darwin 1.1.0 引用 DarwinOptions，而旧版
#   platform_interface 3.1.0 无此类型）→ analyze/compile 失败。
# dependency_overrides 与 host 无关，任何 `pub get` 都会强制到下列精确版本。
dependency_overrides:
  # 全部锁定到「已验证可编译」版本：file_picker 12.1.1 需要 darwin≥(含 skipEntitlementsChecks) 且 <1.1.0（1.1.0 起引用 DarwinOptions，interface 3.1.0 无此类型）
  file_picker: 12.1.1
  file_picker_platform_interface: 3.1.0
  android_file_picker: 1.0.1   # <1.1.0（1.1.0 引用 DarwinOptions）
  file_picker_darwin: 1.0.3    # 含 skipEntitlementsChecks，无 DarwinOptions（CI run 已验证可编译）
  file_picker_linux: 1.0.0     # macOS 本地 lock 无此包；CI linux 构建会编译它。仅 1.0.0 无 DarwinOptions（1.0.1+ 引用）
  file_picker_web: 3.0.1       # web 为浏览器实现，不涉及 DarwinOptions/skipEntitlementsChecks
  windows_file_picker: 1.0.1
  cross_file: 0.3.5+5

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png" # 原图路径（必须是 1024x1024）
  windows:
    generate: true
    # icon_size: 256 # 可选，Windows 图标大小，范围 48~256，默认 48，建议 256 更清晰
  macos:
    generate: true
  linux:
    generate: true

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variations", see
  # https://flutter.dev/to/resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: JetBrainsMono # 自定义 family 名称，随意起，但要唯一
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: JetBrainsMonoNerdFont # Nerd Font 版本，支持图标显示
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont-Regular.ttf
    - family: JetBrainsMonoNerdFontMono # Nerd Font Mono 版本，推荐终端使用
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
